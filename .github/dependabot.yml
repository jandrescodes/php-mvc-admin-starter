version: 2
updates:
  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # 7.x is a deprecated shim without bundled fonts — see AGENTS.md > Dependencies
      - dependency-name: tecnickcom/tcpdf
        versions: [">=7.0"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
